name: Publish Crema ONNX

on:
  workflow_dispatch:
    inputs:
      confirm_private_publication:
        description: Publish validated bytes to the private Hugging Face repository
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-crema-onnx
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_private_publication && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: model-publication
    permissions:
      contents: read
      id-token: write
    env:
      HF_INITIAL_REVISION: 8857fc63d991f2226598c38c160a6a0635a2c679
      HF_OIDC_RESOURCE: grazzolini/tuneforge-models
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev --group publish

      - name: Download verified Crema source
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          uv run --isolated --no-group dev --group convert python -m pip download \
            --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/source" crema==0.2.0

      - name: Build, validate, and stage canonical bytes
        run: |
          uv run --isolated --no-group dev --group convert tuneforge-models build \
            --wheel "$RUNNER_TEMP/source/crema-0.2.0-py3-none-any.whl" \
            --output "$RUNNER_TEMP/build-a"
          uv run --isolated --no-group dev --group convert tuneforge-models build \
            --wheel "$RUNNER_TEMP/source/crema-0.2.0-py3-none-any.whl" \
            --output "$RUNNER_TEMP/build-b"
          uv run tuneforge-models validate \
            --first "$RUNNER_TEMP/build-a" \
            --second "$RUNNER_TEMP/build-b" \
            --report "$RUNNER_TEMP/validation.json"
          uv run tuneforge-models assemble \
            --build "$RUNNER_TEMP/build-a" \
            --output "$RUNNER_TEMP/release" \
            --repository "$PWD" \
            --validation-report "$RUNNER_TEMP/validation.json"

      - name: Publish with short-lived OIDC credentials
        id: upload
        run: |
          title="Publish Crema ONNX ${GITHUB_SHA} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          COMMIT_TITLE="$title" uv run --frozen --group publish python <<'PY'
          import os
          import re
          from pathlib import Path

          from huggingface_hub import HfApi

          info = HfApi().upload_folder(
              repo_id="grazzolini/tuneforge-models",
              repo_type="model",
              folder_path=Path(os.environ["RUNNER_TEMP"]) / "release",
              path_in_repo=".",
              commit_message=os.environ["COMMIT_TITLE"],
              parent_commit=os.environ["HF_INITIAL_REVISION"],
          )
          revision = info.oid
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise ValueError("Hugging Face did not return an immutable revision")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")
          PY

      - name: Record immutable revision for local verification
        env:
          REVISION: ${{ steps.upload.outputs.revision }}
        run: |
          echo "Published immutable revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "Owner-authenticated exact-revision download and offline verification remain required." \
            >> "$GITHUB_STEP_SUMMARY"
