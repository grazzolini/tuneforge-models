name: Publish Beat This small0

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Publish validated Beat This bytes to Hugging Face
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-beat-this-small0
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_publication && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: model-publication
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      HF_OIDC_RESOURCE: grazzolini/tuneforge-models
      CHECKPOINT_SHA256: 6074be2c4d490c5f6101fcc374a1ec72ae93456e23bb6019783b849f5dc7d47b
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-group dev --group beat-this --group publish

      - name: Download verified checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/source/beat_this-small0.ckpt" \
            "https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/small0.ckpt"
          echo "$CHECKPOINT_SHA256  $RUNNER_TEMP/source/beat_this-small0.ckpt" \
            | sha256sum -c -

      - name: Build, validate, and stage one family
        run: |
          uv run --no-group dev --group beat-this tuneforge-models beat-this-build \
            --checkpoint "$RUNNER_TEMP/source/beat_this-small0.ckpt" \
            --output "$RUNNER_TEMP/build-a" --exporter-revision "$GITHUB_SHA"
          uv run --no-group dev --group beat-this tuneforge-models beat-this-build \
            --checkpoint "$RUNNER_TEMP/source/beat_this-small0.ckpt" \
            --output "$RUNNER_TEMP/build-b" --exporter-revision "$GITHUB_SHA"
          uv run --no-group dev --group beat-this tuneforge-models beat-this-release \
            --first "$RUNNER_TEMP/build-a" --second "$RUNNER_TEMP/build-b" \
            --checkpoint "$RUNNER_TEMP/source/beat_this-small0.ckpt" \
            --output "$RUNNER_TEMP/release" --repository "$PWD"
          (cd "$RUNNER_TEMP/release" && sha256sum -c SHA256SUMS)

      - name: Prepare exact family overlay
        id: parent
        run: |
          HF_HUB_DISABLE_IMPLICIT_TOKEN=1 uv run --frozen --no-group dev \
            --group beat-this --group publish python <<'PY'
          import os
          import re
          from pathlib import Path

          from huggingface_hub import HfApi, snapshot_download
          from tuneforge_models.hub_layout import (
              BEAT_THIS, publisher_overlay, read_tree, verify_target_inventory, write_tree,
          )

          root = Path(os.environ["RUNNER_TEMP"])
          api = HfApi()
          revision = api.repo_info(
              "grazzolini/tuneforge-models", repo_type="model", revision="main", token=False
          ).sha
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise ValueError("Hugging Face did not return an immutable parent revision")
          verify_target_inventory(api.list_repo_files(
              "grazzolini/tuneforge-models", repo_type="model", revision=revision, token=False,
          ))
          snapshot_download(
              "grazzolini/tuneforge-models", repo_type="model", revision=revision,
              local_dir=root / "parent", token=False,
          )
          release = read_tree(root / "release")
          expected = publisher_overlay(
              read_tree(root / "parent"), BEAT_THIS, release,
              Path("models/HUB_README.md").read_bytes(),
          )
          write_tree(expected, root / "expected")
          overlay = {"README.md": expected["README.md"]}
          overlay.update({f"beat-this/{name}": data for name, data in release.items()})
          write_tree(overlay, root / "overlay")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")
          PY

      - name: Publish with short-lived OIDC credentials
        id: upload
        env:
          PARENT_REVISION: ${{ steps.parent.outputs.revision }}
        run: |
          title="Publish Beat This small0 ${GITHUB_SHA} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          COMMIT_TITLE="$title" uv run --frozen --no-group dev \
            --group beat-this --group publish python <<'PY'
          import os
          import re
          from pathlib import Path

          from huggingface_hub import HfApi

          info = HfApi().upload_folder(
              repo_id="grazzolini/tuneforge-models", repo_type="model",
              folder_path=Path(os.environ["RUNNER_TEMP"]) / "overlay", path_in_repo=".",
              commit_message=os.environ["COMMIT_TITLE"],
              parent_commit=os.environ["PARENT_REVISION"],
          )
          if re.fullmatch(r"[0-9a-f]{40}", info.oid) is None:
              raise ValueError("Hugging Face did not return an immutable revision")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"revision={info.oid}\n")
          PY

      - name: Verify immutable public bytes anonymously
        env:
          REVISION: ${{ steps.upload.outputs.revision }}
        run: |
          HF_HOME="$RUNNER_TEMP/anonymous-hf-home" HF_HUB_DISABLE_IMPLICIT_TOKEN=1 \
            uv run --frozen --no-group dev --group beat-this --group publish python <<'PY'
          import os
          from pathlib import Path

          import torch
          from executorch.runtime import Runtime
          from huggingface_hub import HfApi, snapshot_download
          from tuneforge_models.hub_layout import (
              read_tree, verify_target, verify_target_inventory,
          )

          root = Path(os.environ["RUNNER_TEMP"])
          verify_target_inventory(HfApi().list_repo_files(
              "grazzolini/tuneforge-models", repo_type="model",
              revision=os.environ["REVISION"], token=False,
          ))
          snapshot_download(
              "grazzolini/tuneforge-models", repo_type="model",
              revision=os.environ["REVISION"], local_dir=root / "download", token=False,
          )
          published = read_tree(root / "download")
          verify_target(published)
          if published != read_tree(root / "expected"):
              raise ValueError("published repository differs from the exact expected overlay")
          os.environ["HF_HUB_OFFLINE"] = "1"
          family = root / "download/beat-this"
          program = Runtime.get().load_program((family / "beat-this-small0.pte").read_bytes())
          method = program.load_method("forward")
          if method is None:
              raise ValueError("published artifact forward method is missing")
          for frames in (13, 1500):
              outputs = method.execute((torch.zeros((1, frames, 128), dtype=torch.float32),))
              if len(outputs) != 2 or any(tuple(value.shape) != (1, frames) for value in outputs):
                  raise ValueError("published artifact contract mismatch")
          PY
          (cd "$RUNNER_TEMP/download/beat-this" && sha256sum -c SHA256SUMS)

      - name: Attest verified public artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/overlay/**

      - name: Record immutable handoff
        env:
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          REVISION: ${{ steps.upload.outputs.revision }}
        run: |
          model="$RUNNER_TEMP/release/beat-this-small0.pte"
          echo "Published immutable revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: beat-this/beat-this-small0.pte" >> "$GITHUB_STEP_SUMMARY"
          echo "Bytes: $(stat --format='%s' "$model")" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "$model" | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Provenance attestation: $ATTESTATION_URL" >> "$GITHUB_STEP_SUMMARY"
