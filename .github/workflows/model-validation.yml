name: Model validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run static and unit checks
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest

      - name: Download verified Crema source
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          uv run --isolated --no-group dev --group convert python -m pip download \
            --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/source" crema==0.2.0

      - name: Build and validate two independent candidates
        run: |
          uv run --isolated --no-group dev --group convert tuneforge-models build \
            --wheel "$RUNNER_TEMP/source/crema-0.2.0-py3-none-any.whl" \
            --output "$RUNNER_TEMP/build-a"
          uv run --isolated --no-group dev --group convert tuneforge-models build \
            --wheel "$RUNNER_TEMP/source/crema-0.2.0-py3-none-any.whl" \
            --output "$RUNNER_TEMP/build-b"
          uv run tuneforge-models validate \
            --first "$RUNNER_TEMP/build-a" \
            --second "$RUNNER_TEMP/build-b" \
            --report "$RUNNER_TEMP/validation.json"
          uv run tuneforge-models assemble \
            --build "$RUNNER_TEMP/build-a" \
            --output "$RUNNER_TEMP/release" \
            --repository "$PWD" \
            --validation-report "$RUNNER_TEMP/validation.json"
          if find "$RUNNER_TEMP/release" -type f \
            \( -name '*.pkl' -o -name '*.h5' -o -name '*.npz' \) | grep -q .; then
            echo "Unsafe build input entered the release directory." >&2
            exit 1
          fi
